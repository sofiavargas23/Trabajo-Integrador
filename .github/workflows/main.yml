name: Corrección automática
on: 
  push: 
    branches: [ main ] 
  workflow\_dispatch:
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps: 
    - name: Descargar código 
      uses: actions/checkout@v4 
    - name: Configurar Java 21
      uses: actions/setup-java@v4 
      with:
        distribution: 'temurin'
        java-version: '21' 
        cache: 'maven' 
    - name: Validar estructura y compilar 
      run: |
        if [ ! -f pom.xml ]; then
          echo "### ❌ No hay pom.xml en la raíz del repositorio" &gt;&gt; "$GITHUB\_STEP\_SUMMARY" 
          exit 1 
        fi 
        mvn -B test
